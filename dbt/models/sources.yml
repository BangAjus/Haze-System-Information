version: 2

sources:
  - name: raw
    schema: raw
    description: Loaded by the Dagster asset raw/weather_air_snapshots.
    tables:
      - name: weather_air_snapshots
        description: >
          The Kaggle file as-is (full history, one row per city per daily collection),
          plus _source, _file, _ingested_at and _dagster_run_id.
        # Freshness of the data itself (newest observation), not of our load time.
        # Run with `make dbt-freshness`. Dagster checks the same thing on every ingest.
        loaded_at_field: "to_timestamp(weather_time_unix)"
        freshness:
          warn_after: { count: 36, period: hour }
          error_after: { count: 60, period: hour }
