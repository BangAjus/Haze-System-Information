# Dagster instance config: run, event and schedule storage in its own Postgres database.
storage:
  postgres:
    postgres_db:
      hostname: { env: POSTGRES_HOST }
      username: { env: POSTGRES_USER }
      password: { env: POSTGRES_PASSWORD }
      db_name: dagster
      port: 5432

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # One raw load at a time: a second daily_ingest waits in the queue instead of
    # truncating the table while the first is still loading it.
    tag_concurrency_limits:
      - key: haze/exclusive
        value: ingest
        limit: 1
      # One OpenWeather job at a time (hourly collection, backfill): shared rate limit
      - key: haze/openweather
        value: api
        limit: 1

# Cancels runs that exceed their job's dagster/max_runtime tag (set in pipeline/jobs.py).
# Mainly for runs whose worker died, e.g. when containers restart mid-run: without this they
# stay "STARTED" forever and block the one-at-a-time queues above.
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  poll_interval_seconds: 120

telemetry:
  enabled: false
